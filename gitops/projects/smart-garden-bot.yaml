apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: smart-garden-bot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Smart Garden Bot IoT automation platform
  
  # Source repositories
  sourceRepos:
  - 'https://github.com/ryanmcafee/smart-garden-bot.git'
  - 'https://github.com/ryanmcafee/smart-garden-bot/gitops.git'
  - 'https://charts.bitnami.com/bitnami'
  - 'https://charts.jetstack.io'
  - 'https://prometheus-community.github.io/helm-charts'
  - 'https://grafana.github.io/helm-charts'
  - 'https://istio-release.storage.googleapis.com/charts'
  
  # Destination clusters and namespaces
  destinations:
  - namespace: 'smart-garden-bot*'
    server: https://kubernetes.default.svc
  - namespace: 'monitoring'
    server: https://kubernetes.default.svc
  - namespace: 'istio-system'
    server: https://kubernetes.default.svc
  - namespace: 'cert-manager'
    server: https://kubernetes.default.svc
  - namespace: 'ingress-nginx'
    server: https://kubernetes.default.svc
    
  # Cluster resource whitelist
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRole
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRoleBinding
  - group: 'apiextensions.k8s.io'
    kind: CustomResourceDefinition
  - group: 'admissionregistration.k8s.io'
    kind: MutatingWebhookConfiguration
  - group: 'admissionregistration.k8s.io'  
    kind: ValidatingWebhookConfiguration
  - group: 'networking.k8s.io'
    kind: IngressClass
  - group: 'storage.k8s.io'
    kind: StorageClass
  - group: 'policy'
    kind: PodSecurityPolicy
  - group: 'security.istio.io'
    kind: PeerAuthentication
  - group: 'networking.istio.io'
    kind: Gateway
    
  # Namespace resource whitelist
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: 'apps'
    kind: Deployment
  - group: 'apps'
    kind: StatefulSet
  - group: 'apps'
    kind: DaemonSet
  - group: 'apps'
    kind: ReplicaSet
  - group: 'batch'
    kind: Job
  - group: 'batch'
    kind: CronJob
  - group: 'networking.k8s.io'
    kind: Ingress
  - group: 'networking.k8s.io'
    kind: NetworkPolicy
  - group: 'policy'
    kind: PodDisruptionBudget
  - group: 'autoscaling'
    kind: HorizontalPodAutoscaler
  - group: 'monitoring.coreos.com'
    kind: ServiceMonitor
  - group: 'monitoring.coreos.com'
    kind: PrometheusRule
  - group: 'garden.smartbot.io'
    kind: GardenController
  - group: 'garden.smartbot.io'
    kind: Sensor
  - group: 'networking.istio.io'
    kind: VirtualService
  - group: 'networking.istio.io'
    kind: DestinationRule
  - group: 'security.istio.io'
    kind: AuthorizationPolicy
  - group: 'postgresql.cnpg.io'
    kind: Cluster
  - group: 'postgresql.cnpg.io'
    kind: Backup
  - group: 'postgresql.cnpg.io'
    kind: ScheduledBackup
    
  # Roles for project members
  roles:
  - name: admin
    description: Full access to Smart Garden Bot project
    policies:
    - p, proj:smart-garden-bot:admin, applications, *, smart-garden-bot/*, allow
    - p, proj:smart-garden-bot:admin, repositories, *, *, allow
    - p, proj:smart-garden-bot:admin, certificates, *, *, allow
    - p, proj:smart-garden-bot:admin, clusters, *, *, allow
    groups:
    - smart-garden-bot:admins
    
  - name: developer
    description: Developer access to Smart Garden Bot project
    policies:
    - p, proj:smart-garden-bot:developer, applications, get, smart-garden-bot/*, allow
    - p, proj:smart-garden-bot:developer, applications, sync, smart-garden-bot/*, allow
    - p, proj:smart-garden-bot:developer, applications, action/*, smart-garden-bot/*, allow
    - p, proj:smart-garden-bot:developer, repositories, get, *, allow
    groups:
    - smart-garden-bot:developers
    
  - name: readonly
    description: Read-only access to Smart Garden Bot project
    policies:
    - p, proj:smart-garden-bot:readonly, applications, get, smart-garden-bot/*, allow
    - p, proj:smart-garden-bot:readonly, repositories, get, *, allow
    groups:
    - smart-garden-bot:readonly
    
  # Sync windows
  syncWindows:
  - kind: allow
    schedule: '* * * * *'
    duration: 24h
    applications:
    - '*'
    manualSync: true
  - kind: deny
    schedule: '0 2 * * 1-5'  # Deny automatic sync during maintenance window
    duration: 2h
    applications:
    - 'smart-garden-bot-production'
    manualSync: false