{{- if .Values.secrets.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.database.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-garden-bot.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
data:
  database-url: {{ printf "postgresql://%s:%s@%s:%g/%s?sslmode=require" (include "smart-garden-bot.postgresql.username" .) "PASSWORD_PLACEHOLDER" (include "smart-garden-bot.postgresql.host" .) (include "smart-garden-bot.postgresql.port" . | float64) (include "smart-garden-bot.postgresql.database" .) | b64enc }}
  {{- range $key, $value := .Values.secrets.database.data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
---
{{- end }}
{{- if .Values.secrets.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.auth.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-garden-bot.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
data:
  auth0-client-secret: {{ .Values.secrets.auth.data.auth0ClientSecret | default "changeme" | b64enc }}
  nextauth-secret: {{ .Values.secrets.auth.data.nextauthSecret | default "changeme" | b64enc }}
  {{- range $key, $value := .Values.secrets.auth.data }}
  {{- if and (ne $key "auth0ClientSecret") (ne $key "nextauthSecret") }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  {{- end }}
---
{{- end }}
{{- if .Values.secrets.weather.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.weather.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-garden-bot.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
data:
  openweather-api-key: {{ .Values.secrets.weather.data.openweatherApiKey | default "changeme" | b64enc }}
  weatherapi-key: {{ .Values.secrets.weather.data.weatherApiKey | default "changeme" | b64enc }}
  {{- range $key, $value := .Values.secrets.weather.data }}
  {{- if and (ne $key "openweatherApiKey") (ne $key "weatherApiKey") }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  {{- end }}
---
{{- end }}
{{- if .Values.secrets.stripe.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.stripe.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-garden-bot.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
data:
  stripe-secret-key: {{ .Values.secrets.stripe.data.stripeSecretKey | default "changeme" | b64enc }}
  stripe-webhook-secret: {{ .Values.secrets.stripe.data.stripeWebhookSecret | default "changeme" | b64enc }}
  stripe-publishable-key: {{ .Values.secrets.stripe.data.stripePublishableKey | default "changeme" | b64enc }}
  {{- range $key, $value := .Values.secrets.stripe.data }}
  {{- if and (ne $key "stripeSecretKey") (ne $key "stripeWebhookSecret") (ne $key "stripePublishableKey") }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}