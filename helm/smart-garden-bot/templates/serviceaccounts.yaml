{{- if .Values.webApp.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smart-garden-bot.serviceAccountName.web" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-garden-bot.labels.web" . | nindent 4 }}
  {{- with .Values.webApp.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smart-garden-bot.serviceAccountName.api" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-garden-bot.labels.api" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
---
{{- end }}
{{- if .Values.operator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smart-garden-bot.serviceAccountName.operator" . }}
  namespace: {{ .Release.Namespace }}-system
  labels:
    {{- include "smart-garden-bot.labels.operator" . | nindent 4 }}
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
{{- end }}