# Disable production monitoring dependencies
monitoring:
  prometheus:
    enabled: false
  grafana:
    enabled: false
  loki:
    enabled: false

# Disable Istio in development
istio:
  enabled: false

# Enable development debugging features
podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false