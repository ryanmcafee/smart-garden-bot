apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  name: gardencontrollers.garden.smartbot.io
spec:
  group: garden.smartbot.io
  names:
    kind: GardenController
    listKind: GardenControllerList
    plural: gardencontrollers
    shortNames:
    - gc
    singular: gardencontroller
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.zones[*].id
      name: Zones
      type: integer
    - jsonPath: .spec.autoWatering
      name: Auto-Watering
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: GardenController is the Schema for the gardencontrollers API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: GardenControllerSpec defines the desired state of GardenController
            properties:
              autoWatering:
                default: true
                description: AutoWatering enables automatic watering based on conditions
                type: boolean
              deviceConfig:
                description: DeviceConfig specifies the IoT device configuration
                properties:
                  credentialsSecret:
                    description: CredentialsSecret references credentials for device
                      authentication
                    properties:
                      key:
                        description: Key within the secret
                        type: string
                      name:
                        description: Name of the secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  endpoint:
                    description: Endpoint for device communication
                    type: string
                  retryAttempts:
                    default: 3
                    description: RetryAttempts for failed device operations
                    format: int32
                    type: integer
                  timeout:
                    default: 30s
                    description: Timeout for device communication
                    type: string
                  type:
                    description: Type of the IoT device
                    enum:
                    - ecowitt
                    - custom
                    type: string
                required:
                - endpoint
                - type
                type: object
              gardenId:
                description: GardenID from the API database
                type: string
              location:
                description: Location defines the garden's geographic location
                properties:
                  latitude:
                    description: Latitude in decimal degrees
                    maximum: 90
                    minimum: -90
                    type: number
                  longitude:
                    description: Longitude in decimal degrees
                    maximum: 180
                    minimum: -180
                    type: number
                  name:
                    description: Name of the location (e.g., "Backyard Garden")
                    type: string
                  timezone:
                    description: Timezone in IANA format (e.g., "America/New_York")
                    type: string
                required:
                - latitude
                - longitude
                - name
                - timezone
                type: object
              maintenanceMode:
                default: false
                description: MaintenanceMode disables all watering when enabled
                type: boolean
              notificationConfig:
                description: NotificationConfig defines how to send alerts
                properties:
                  email:
                    description: Email notification settings
                    properties:
                      enabled:
                        description: Enabled controls whether email notifications
                          are sent
                        type: boolean
                      recipients:
                        description: Recipients list of email addresses
                        items:
                          type: string
                        type: array
                      smtpSecret:
                        description: SMTPSecret references SMTP configuration secret
                        properties:
                          key:
                            description: Key within the secret
                            type: string
                          name:
                            description: Name of the secret
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - enabled
                    type: object
                  slack:
                    description: Slack notification settings
                    properties:
                      channel:
                        description: Channel to send notifications to
                        type: string
                      enabled:
                        description: Enabled controls whether Slack notifications
                          are sent
                        type: boolean
                      webhookUrl:
                        description: WebhookURL for Slack integration
                        type: string
                    required:
                    - enabled
                    type: object
                  webhook:
                    description: Webhook notification settings
                    properties:
                      enabled:
                        description: Enabled controls whether webhook notifications
                          are sent
                        type: boolean
                      secret:
                        description: Secret for webhook authentication
                        properties:
                          key:
                            description: Key within the secret
                            type: string
                          name:
                            description: Name of the secret
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      url:
                        description: URL for the webhook endpoint
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              userId:
                description: UserID identifies the owner of this garden
                type: string
              weatherIntegration:
                description: WeatherIntegration configures weather data sources
                properties:
                  apiKeySecret:
                    description: APIKeySecret references a secret containing the API
                      key
                    properties:
                      key:
                        description: Key within the secret
                        type: string
                      name:
                        description: Name of the secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  location:
                    description: Location for weather data (city name or coordinates)
                    type: string
                  provider:
                    default: openweathermap
                    description: Provider specifies the weather data provider
                    enum:
                    - openweathermap
                    - weatherapi
                    - noaa
                    type: string
                  rainThreshold:
                    default: 5
                    description: RainThreshold defines the rainfall amount (mm) that
                      skips watering
                    type: number
                  updateInterval:
                    default: 30m
                    description: UpdateInterval specifies how often to fetch weather
                      data
                    type: string
                required:
                - location
                type: object
              zones:
                description: Zones defines the watering zones in this garden
                items:
                  description: Zone represents a watering zone with its configuration
                  properties:
                    duration:
                      description: Duration specifies how long to water (in minutes)
                      format: int32
                      maximum: 120
                      minimum: 1
                      type: integer
                    enabled:
                      default: true
                      description: Enabled controls whether this zone is active
                      type: boolean
                    id:
                      description: ID uniquely identifies this zone
                      type: string
                    moistureThreshold:
                      description: MoisureThreshold is the soil moisture level below
                        which watering is triggered
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    name:
                      description: Name is a human-readable name for the zone
                      type: string
                    plantType:
                      description: PlantType describes what's planted in this zone
                      type: string
                    schedule:
                      description: Schedule defines when to water this zone (cron
                        format)
                      type: string
                    sensorIds:
                      description: SensorIDs lists the sensors monitoring this zone
                      items:
                        type: string
                      type: array
                  required:
                  - duration
                  - id
                  - name
                  - schedule
                  type: object
                minItems: 1
                type: array
            required:
            - deviceConfig
            - gardenId
            - location
            - userId
            - weatherIntegration
            - zones
            type: object
          status:
            description: GardenControllerStatus defines the observed state of GardenController
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource. --- This struct is intended for direct
                    use as an array at the field path .status.conditions.  For example,
                    \n type FooStatus struct{ // Represents the observations of a
                    foo's current state. // Known .status.conditions.type are: \"Available\",
                    \"Progressing\", and \"Degraded\" // +patchMergeKey=type // +patchStrategy=merge
                    // +listType=map // +listMapKey=type Conditions []metav1.Condition
                    `json:\"conditions,omitempty\" patchStrategy:\"merge\" patchMergeKey:\"type\"
                    protobuf:\"bytes,1,rep,name=conditions\"` \n // other fields }"
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition
                        transitioned from one status to another. This should be when
                        the underlying condition changed.  If that is not known, then
                        using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating
                        details about the transition. This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation
                        that the condition was set based upon. For instance, if .metadata.generation
                        is currently 12, but the .status.conditions[x].observedGeneration
                        is 9, the condition is out of date with respect to the current
                        state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating
                        the reason for the condition's last transition. Producers
                        of specific condition types may define expected values and
                        meanings for this field, and whether the values are considered
                        a guaranteed API. The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        --- Many .condition.type values are consistent across resources
                        like Available, but because arbitrary conditions can be useful
                        (see .node.status.conditions), the ability to deconflict is
                        important. The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastWateringEvent:
                description: LastWateringEvent records the most recent watering activity
                properties:
                  duration:
                    description: Duration of the watering session
                    type: string
                  endTime:
                    description: EndTime when watering completed
                    format: date-time
                    type: string
                  error:
                    description: Error message if watering failed
                    type: string
                  reason:
                    description: Reason why watering was triggered
                    type: string
                  startTime:
                    description: StartTime when watering began
                    format: date-time
                    type: string
                  status:
                    description: Status of the watering event
                    enum:
                    - Started
                    - Completed
                    - Failed
                    - Cancelled
                    type: string
                  zoneId:
                    description: ZoneID identifies which zone was watered
                    type: string
                required:
                - startTime
                - status
                - zoneId
                type: object
              lastWeatherUpdate:
                description: LastWeatherUpdate indicates when weather data was last
                  fetched
                format: date-time
                type: string
              nextScheduledWatering:
                description: NextScheduledWatering indicates when the next watering
                  will occur
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed spec
                format: int64
                type: integer
              phase:
                description: Phase represents the current phase of the garden controller
                enum:
                - Pending
                - Running
                - Error
                - Maintenance
                type: string
              sensorStatuses:
                description: SensorStatuses provides status for connected sensors
                items:
                  description: SensorStatus represents the status of a sensor
                  properties:
                    batteryLevel:
                      description: BatteryLevel percentage (0-100)
                      type: number
                    connected:
                      description: Connected indicates if the sensor is reachable
                      type: boolean
                    error:
                      description: Error message if sensor is malfunctioning
                      type: string
                    lastReading:
                      description: LastReading timestamp of the last sensor reading
                      format: date-time
                      type: string
                    sensorId:
                      description: SensorID identifies the sensor
                      type: string
                    signalStrength:
                      description: SignalStrength percentage (0-100)
                      type: number
                  required:
                  - connected
                  - sensorId
                  type: object
                type: array
              weatherConditions:
                description: WeatherConditions contains current weather information
                properties:
                  forecastRain:
                    description: ForecastRain expected rainfall in next 24h (mm)
                    type: number
                  humidity:
                    description: Humidity percentage
                    type: number
                  lastUpdated:
                    description: LastUpdated timestamp when weather data was fetched
                    format: date-time
                    type: string
                  pressure:
                    description: Pressure in hPa
                    type: number
                  rainfallToday:
                    description: RainfallToday in mm
                    type: number
                  temperature:
                    description: Temperature in Celsius
                    type: number
                  windSpeed:
                    description: WindSpeed in km/h
                    type: number
                required:
                - forecastRain
                - humidity
                - lastUpdated
                - pressure
                - rainfallToday
                - temperature
                - windSpeed
                type: object
              zoneStatuses:
                description: ZoneStatuses provides status for each zone
                items:
                  description: ZoneStatus represents the status of a watering zone
                  properties:
                    health:
                      description: Health status of the zone
                      enum:
                      - Healthy
                      - Warning
                      - Error
                      type: string
                    isWatering:
                      description: IsWatering indicates if the zone is currently being
                        watered
                      type: boolean
                    lastWatered:
                      description: LastWatered timestamp of the last watering
                      format: date-time
                      type: string
                    nextWatering:
                      description: NextWatering scheduled time for next watering
                      format: date-time
                      type: string
                    soilMoisture:
                      description: SoilMoisture percentage (0-100)
                      type: number
                    zoneId:
                      description: ZoneID identifies the zone
                      type: string
                  required:
                  - isWatering
                  - zoneId
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}