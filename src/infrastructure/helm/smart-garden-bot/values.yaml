# Default values for smart-garden-bot
# This is a YAML-formatted file with configuration values for the Smart Garden Bot application

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  
# Application metadata
nameOverride: ""
fullnameOverride: ""

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: smart-garden-bot
  app.kubernetes.io/part-of: smart-garden-bot
  
# Common annotations applied to all resources  
commonAnnotations: {}

# =============================================
# WEB APPLICATION (Next.js Frontend)
# =============================================
webapp:
  enabled: true
  
  image:
    registry: docker.io
    repository: smartgardenbot/webapp
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicaCount: 2
  
  # Pod configuration
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  # Service configuration
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: app.smartgardenbot.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: webapp-tls
        hosts:
          - app.smartgardenbot.com

  # Environment variables
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_BASE_URL: "https://api.smartgardenbot.com/api/v1"
    AUTH0_BASE_URL: "https://app.smartgardenbot.com"
    AUTH0_ISSUER_BASE_URL: "https://smartgardenbot.auth0.com"

  # Environment variables from secrets
  envFrom:
    - secretRef:
        name: webapp-secrets

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Health checks
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================
# API SERVER (Go Backend)
# =============================================
api:
  enabled: true
  
  image:
    registry: docker.io
    repository: smartgardenbot/api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicaCount: 3
  
  # Pod configuration
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  podLabels: {}
  podSecurityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"

  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: api.smartgardenbot.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-tls
        hosts:
          - api.smartgardenbot.com

  # Environment variables
  env:
    ENVIRONMENT: production
    SERVER_PORT: "8080"
    METRICS_ENABLED: "true"
    LOG_LEVEL: info
    DB_HOST: smart-garden-bot-postgresql
    DB_PORT: "5432"
    DB_NAME: smart_garden_bot
    DB_USER: postgres
    DB_SSL_MODE: require
    REDIS_HOST: smart-garden-bot-redis-master
    REDIS_PORT: "6379"

  # Environment variables from secrets
  envFrom:
    - secretRef:
        name: api-secrets

  # Resource limits and requests
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Health checks
  livenessProbe:
    httpGet:
      path: /liveness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Startup probe for slow starts
  startupProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================
# KUBERNETES OPERATOR
# =============================================
operator:
  enabled: true
  
  image:
    registry: docker.io
    repository: smartgardenbot/operator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicaCount: 1 # Operators should typically run as single instance
  
  # Pod configuration
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  podLabels: {}
  podSecurityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  # Service configuration (for metrics)
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"

  # Environment variables
  env:
    RECONCILE_INTERVAL: "30s"
    METRICS_BIND_ADDRESS: ":8080"
    HEALTH_PROBE_BIND_ADDRESS: ":8081"
    LEADER_ELECT: "true"

  # Environment variables from secrets
  envFrom:
    - secretRef:
        name: operator-secrets

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Health checks
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # RBAC configuration
  rbac:
    create: true
    rules:
      - apiGroups: [""]
        resources: ["secrets", "configmaps", "events"]
        verbs: ["get", "list", "watch", "create", "update", "patch"]
      - apiGroups: ["garden.smartbot.io"]
        resources: ["gardencontrollers", "wateringschedules", "sensordevices"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["garden.smartbot.io"]
        resources: ["gardencontrollers/status", "wateringschedules/status", "sensordevices/status"]
        verbs: ["get", "update", "patch"]

  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================
# DATABASE (PostgreSQL with CloudNativePG)
# =============================================
postgresql:
  enabled: false # Use CloudNativePG instead

cloudnative-pg:
  enabled: true
  
# PostgreSQL cluster using CloudNativePG operator
postgresqlCluster:
  enabled: true
  name: smart-garden-bot-postgres
  
  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "4"
      effective_io_concurrency: "2"
      work_mem: "4MB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
      
  # Cluster specification
  spec:
    instances: 3
    primaryUpdateStrategy: unsupervised
    
    postgresql:
      parameters:
        max_connections: "200"
        shared_buffers: "256MB"
        effective_cache_size: "1GB"
        log_checkpoints: "on"
        log_lock_waits: "on"
        log_min_duration_statement: "1000"
        log_statement: "ddl"
        log_temp_files: "0"
        
    # Bootstrap configuration
    bootstrap:
      initdb:
        database: smart_garden_bot
        owner: postgres
        encoding: UTF8
        localeCollate: en_US.UTF-8
        localeCType: en_US.UTF-8
        postInitApplicationSQL:
          - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          - CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          - CREATE EXTENSION IF NOT EXISTS "vector";
          - CREATE EXTENSION IF NOT EXISTS "timescaledb";

    # Storage configuration
    storage:
      size: 100Gi
      storageClass: fast-ssd
      
    # Monitoring
    monitoring:
      enabled: true
      podMonitorEnabled: true
      
    # Backup configuration
    backup:
      retentionPolicy: "30d"
      barmanObjectStore:
        destinationPath: "s3://smart-garden-bot-backups"
        s3Credentials:
          accessKeyId:
            name: postgres-backup-secret
            key: AWS_ACCESS_KEY_ID
          secretAccessKey:
            name: postgres-backup-secret
            key: AWS_SECRET_ACCESS_KEY
          region:
            name: postgres-backup-secret
            key: AWS_REGION
        wal:
          retention: "7d"
        data:
          retention: "30d"

# =============================================
# REDIS (Caching and Sessions)
# =============================================
redis:
  enabled: true
  
  # Redis configuration
  auth:
    enabled: true
    existingSecret: redis-secret
    existingSecretPasswordKey: password
    
  # Master configuration
  master:
    count: 1
    persistence:
      enabled: true
      size: 8Gi
      storageClass: standard
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    
  # Replica configuration
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 8Gi
      storageClass: standard
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# =============================================
# MONITORING AND OBSERVABILITY
# =============================================
monitoring:
  enabled: true
  
  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      app: smart-garden-bot
    interval: 30s
    scrapeTimeout: 10s
    
  # Grafana Dashboard
  grafanaDashboard:
    enabled: true
    namespace: monitoring
    labels:
      grafana_dashboard: "1"

# =============================================
# SECRETS MANAGEMENT
# =============================================
secrets:
  # Create secrets from external secret management system
  external:
    enabled: true
    secretStore:
      provider: aws
      region: us-west-2
    
  # Secret definitions
  webapp:
    - name: AUTH0_CLIENT_SECRET
      key: auth0/client-secret
    - name: AUTH0_SECRET
      key: auth0/secret
      
  api:
    - name: DB_PASSWORD
      key: postgres/password
    - name: JWT_SECRET
      key: jwt/secret
    - name: OPENWEATHERMAP_API_KEY
      key: weather/openweathermap-key
    - name: WEATHER_API_KEY
      key: weather/api-key
    - name: REDIS_PASSWORD
      key: redis/password
      
  operator:
    - name: WEATHER_API_KEY
      key: weather/api-key

# =============================================
# NETWORK POLICIES
# =============================================
networkPolicy:
  enabled: true
  
  # Default deny all traffic
  defaultDeny: true
  
  # Ingress rules
  ingress:
    # Allow webapp to communicate with API server
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-garden-bot
              app.kubernetes.io/component: webapp
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-garden-bot
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
          
    # Allow API server to communicate with database
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-garden-bot
              app.kubernetes.io/component: api
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-garden-bot-postgres
      ports:
        - protocol: TCP
          port: 5432
          
    # Allow operator to communicate with API server
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-garden-bot
              app.kubernetes.io/component: operator
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-garden-bot
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080

# =============================================
# POD DISRUPTION BUDGETS
# =============================================
podDisruptionBudget:
  enabled: true
  
  webapp:
    minAvailable: 1
    
  api:
    minAvailable: 2
    
  operator:
    minAvailable: 0 # Single instance, can be disrupted

# =============================================
# PERSISTENCE
# =============================================
persistence:
  # Temporary storage for file uploads, caching, etc.
  temp:
    enabled: true
    size: 10Gi
    storageClass: standard
    accessMode: ReadWriteOnce

# =============================================
# CONFIGURATION
# =============================================
config:
  # Application configuration
  app:
    name: "Smart Garden Bot"
    environment: production
    logLevel: info
    
  # Feature flags
  features:
    weatherIntegration: true
    plantDiseaseDetection: true
    aiRecommendations: true
    mobileApp: true
    
  # Rate limiting
  rateLimit:
    enabled: true
    requests: 100
    window: "1m"
    
  # CORS configuration
  cors:
    allowedOrigins:
      - "https://app.smartgardenbot.com"
      - "https://smartgardenbot.com"
    allowedMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowedHeaders:
      - Authorization
      - Content-Type
      - X-API-Key