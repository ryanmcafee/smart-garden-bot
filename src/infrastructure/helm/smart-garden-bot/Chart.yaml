apiVersion: v2
name: smart-garden-bot
description: A Helm chart for Smart Garden Bot - Intelligent garden irrigation automation platform
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://smartgardenbot.io
sources:
  - https://github.com/ryanmcafee/smart-garden-bot/smart-garden-bot
maintainers:
  - name: Smart Garden Bot Team
    email: team@smartgardenbot.io
    url: https://smartgardenbot.io
keywords:
  - garden
  - automation
  - iot
  - irrigation
  - kubernetes
  - postgresql
  - nextjs
  - golang
annotations:
  category: Agriculture
  licenses: MIT
icon: https://smartgardenbot.io/static/icon.png

dependencies:
  - name: postgresql
    version: "13.2.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    tags:
      - database
  - name: redis
    version: "18.4.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
    tags:
      - cache
  - name: cloudnative-pg
    version: "0.19.1"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: cloudnative-pg.enabled
    tags:
      - database
      - postgres-operator