{{- if .Values.apiserver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-garden-bot.fullname" . }}-apiserver
  labels:
    {{- include "smart-garden-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.apiserver.autoscaling.enabled }}
  replicas: {{ .Values.apiserver.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "smart-garden-bot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: apiserver
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/apiserver-configmap.yaml") . | sha256sum }}
        {{- with .Values.apiserver.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "smart-garden-bot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: apiserver
        {{- with .Values.apiserver.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.apiserver.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smart-garden-bot.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.apiserver.podSecurityContext | nindent 8 }}
      initContainers:
        - name: db-migration
          image: "{{ .Values.apiserver.image.registry }}/{{ .Values.apiserver.image.repository }}:{{ .Values.apiserver.image.tag | default .Chart.AppVersion }}"
          command: ["./migrate"]
          args: ["up"]
          env:
            {{- range $key, $value := .Values.apiserver.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.apiserver.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: apiserver
          securityContext:
            {{- toYaml .Values.apiserver.securityContext | nindent 12 }}
          image: "{{ .Values.apiserver.image.registry }}/{{ .Values.apiserver.image.repository }}:{{ .Values.apiserver.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.apiserver.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apiserver.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $key, $value := .Values.apiserver.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Add pod information for better observability
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- with .Values.apiserver.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.apiserver.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.apiserver.readinessProbe | nindent 12 }}
          {{- if .Values.apiserver.startupProbe }}
          startupProbe:
            {{- toYaml .Values.apiserver.startupProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: migrations
              mountPath: /app/migrations
              readOnly: true
            {{- if .Values.persistence.temp.enabled }}
            - name: temp-storage
              mountPath: /app/temp
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: migrations
          configMap:
            name: {{ include "smart-garden-bot.fullname" . }}-migrations
        {{- if .Values.persistence.temp.enabled }}
        - name: temp-storage
          persistentVolumeClaim:
            claimName: {{ include "smart-garden-bot.fullname" . }}-temp-storage
        {{- end }}
      {{- with .Values.apiserver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiserver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiserver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}