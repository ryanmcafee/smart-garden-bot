---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smart-garden-bot-operator
  namespace: smart-garden-bot-system
  labels:
    app.kubernetes.io/name: smart-garden-bot-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smart-garden-bot-operator
  labels:
    app.kubernetes.io/name: smart-garden-bot-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
# Garden Controller CRD permissions
- apiGroups:
  - garden.smartbot.io
  resources:
  - gardencontrollers
  - gardencontrollers/status
  - gardencontrollers/finalizers
  - sensors
  - sensors/status
  - sensors/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Core Kubernetes resources
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - services
  - serviceaccounts
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  - pods/status
  verbs:
  - get
  - list
  - watch
# Apps resources
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Batch resources for cron jobs
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Networking resources
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Monitoring resources
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  - prometheusrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Istio resources
- apiGroups:
  - networking.istio.io
  resources:
  - virtualservices
  - destinationrules
  - gateways
  - serviceentries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.istio.io
  resources:
  - authorizationpolicies
  - peerauthentications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: smart-garden-bot-operator
  labels:
    app.kubernetes.io/name: smart-garden-bot-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: smart-garden-bot-operator
subjects:
- kind: ServiceAccount
  name: smart-garden-bot-operator
  namespace: smart-garden-bot-system
---
# Role for operator to manage resources in application namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smart-garden-bot-operator-app
  namespace: smart-garden-bot
  labels:
    app.kubernetes.io/name: smart-garden-bot-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - services
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smart-garden-bot-operator-app
  namespace: smart-garden-bot
  labels:
    app.kubernetes.io/name: smart-garden-bot-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: smart-garden-bot-operator-app
subjects:
- kind: ServiceAccount
  name: smart-garden-bot-operator
  namespace: smart-garden-bot-system
