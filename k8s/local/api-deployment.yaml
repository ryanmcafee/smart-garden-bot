---
apiVersion: v1
kind: Secret
metadata:
  name: api-config
  namespace: smart-garden-bot-api
type: Opaque
stringData:
  ENVIRONMENT: "development"
  DB_HOST: "smart-garden-bot-postgres-rw.smart-garden-bot-db.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "smartgarden"
  DB_USER: "smartgarden"
  DB_PASSWORD: "localdev123"
  DB_SSL_MODE: "disable"
  JWT_SECRET: "local-dev-secret-key-change-in-production"
  JWT_ISSUER: "smart-garden-bot-local"
  LOG_LEVEL: "debug"
  METRICS_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: smart-garden-bot-api
  labels:
    app: api
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: backend
    spec:
      containers:
      - name: api
        image: kind-registry:5000/smart-garden-bot/api:local
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVER_PORT
          value: "8080"
        envFrom:
        - secretRef:
            name: api-config
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      serviceAccountName: api-service-account
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: smart-garden-bot-api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 8080
    targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service-account
  namespace: smart-garden-bot-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-cluster-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-cluster-role
subjects:
- kind: ServiceAccount
  name: api-service-account
  namespace: smart-garden-bot-api