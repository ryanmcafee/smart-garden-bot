---
# Istio Gateway for Smart Garden Bot
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: smart-garden-bot-gateway
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - app.smartgardenbot.io
    - api.smartgardenbot.io
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: smartgardenbot-prod-tls
    hosts:
    - app.smartgardenbot.io
    - api.smartgardenbot.io

---
# VirtualService for Web Application
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: smart-garden-bot-web
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
  - app.smartgardenbot.io
  gateways:
  - smart-garden-bot-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: smart-garden-bot-web
        port:
          number: 3000
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 5s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
    timeout: 30s

---
# VirtualService for API Server
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: smart-garden-bot-api
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
  - api.smartgardenbot.io
  gateways:
  - smart-garden-bot-gateway
  http:
  - match:
    - uri:
        prefix: /api/v1/
    route:
    - destination:
        host: smart-garden-bot-api
        port:
          number: 8080
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 5s
    retries:
      attempts: 3
      perTryTimeout: 30s
      retryOn: gateway-error,connect-failure,refused-stream
    timeout: 60s
    corsPolicy:
      allowOrigins:
      - exact: https://app.smartgardenbot.io
      - exact: https://dev.app.smartgardenbot.io
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - authorization
      - content-type
      - x-requested-with
      allowCredentials: true
      maxAge: 24h

---
# DestinationRule for Web Application
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: smart-garden-bot-web
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  host: smart-garden-bot-web
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

---
# DestinationRule for API Server
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: smart-garden-bot-api
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  host: smart-garden-bot-api
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 200
        maxRequestsPerConnection: 20
        maxRetries: 3
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

---
# PeerAuthentication for mutual TLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  mtls:
    mode: STRICT

---
# AuthorizationPolicy for API Server
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: smart-garden-bot-api-authz
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  rules:
  # Allow health checks
  - from:
    - source:
        principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/health", "/ready", "/metrics"]
  # Allow authenticated API requests
  - from:
    - source:
        principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        paths: ["/api/v1/*"]
    when:
    - key: request.headers[authorization]
      values: ["Bearer *"]
  # Allow web app to call API
  - from:
    - source:
        principals: ["cluster.local/ns/smart-garden-bot/sa/smart-garden-bot-web"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        paths: ["/api/v1/*"]

---
# AuthorizationPolicy for Web Application
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: smart-garden-bot-web-authz
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  rules:
  # Allow all traffic to web app (authentication handled by app)
  - from:
    - source:
        principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
    to:
    - operation:
        methods: ["GET", "POST"]

---
# ServiceEntry for external APIs
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-apis
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  hosts:
  - api.openweathermap.org
  - api.weather.gov
  - api.weatherapi.com
  - api.open-meteo.com
  - smartgarden.auth0.com
  - api.stripe.com
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS

---
# Telemetry configuration
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: default-metrics
  namespace: smart-garden-bot
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  metrics:
  - providers:
    - name: prometheus
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        request_protocol:
          operation: UPSERT
          value: "request.protocol | 'unknown'"